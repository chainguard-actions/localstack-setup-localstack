name: Test basic LocalStack startup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker (ensure available)
        run: docker info

      - id: action
        uses: .
        continue-on-error: true
        with:
          image-tag: latest
          install-awslocal: 'true'
          use-pro: 'false'
          skip-wait: 'true'

      - name: Assert action ran (LocalStack started or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: LocalStack started successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act due to _actions dir structure or Docker-in-Docker limitations)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
