name: 'Start up Localstack'
description: 'Starts up Localstack'
inputs:
  image-tag:
    description: 'Tag of the LocalStack Docker image to use'
    required: true
    default: 'latest'
  install-awslocal:
    description: 'Whether to install the `awslocal` CLI into the environment'
    required: true
    default: 'true'
  use-pro:
    description: 'Whether to use LocalStack Pro (requires a valid CI Auth Token)'
    required: false
    default: 'false'
  configuration:
    description: 'Configuration variables to use for LocalStack'
    required: false
    default: ''
  ci-project:
    description: 'Name of the CI project to track in LocalStack Cloud'
    required: false
    default: ''
  skip-wait:
    description: 'Skip wait for LocalStack'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    # # NOTE: Thinking about this if we need it
    # - name: Initial PR comment
    #   # TODO: potentially replace with Action version number over time
    #   uses: LocalStack/setup-localstack/prepare@main
    #   if: inputs.ci-project && inputs.github-token
    #   with:
    #     github-token: ${{ inputs.github-token }}
    #     ci-project: ${{ inputs.ci-project }}
    - run: echo "GH_ACTION_ROOT=$(cd "$GITHUB_ACTION_PATH/.." && pwd)" >> "$GITHUB_ENV"
      shell: bash
    - name: Install tools
      uses: jenseng/dynamic-uses@5175289a9a87978dcfcb9cf512b821d23b2a53eb # v1
      with:
        uses: ${{ env.GH_ACTION_ROOT }}/tools
        with: |-
          {
            "install-awslocal": ${{ toJSON(inputs.install-awslocal) }},
          }
    - name: Start LocalStack
      run: |
        if [ "$USE_PRO" = true ]; then
          if [ "x$LOCALSTACK_AUTH_TOKEN" = "x" -o "x$LOCALSTACK_API_KEY" = "x" ]; then
            echo "WARNING: LocalStack Auth Token not detected, please verify your configuration..."
          fi
          CONFIGURATION="DNS_ADDRESS=127.0.0.1 ${CONFIGURATION}"
          IMAGE_NAME="${IMAGE_NAME:-localstack/localstack-pro:${IMAGE_TAG}}"
        else
          IMAGE_NAME="${IMAGE_NAME:-localstack/localstack:${IMAGE_TAG}}"
        fi

        CONFIGURATION="IMAGE_NAME=${IMAGE_NAME} ${CONFIGURATION}"
        docker pull "${IMAGE_NAME}" &
        cfg_args=()
        if [ -n "$CONFIGURATION" ]; then
          while IFS= read -r -d '' t; do cfg_args+=("$t"); done \
            < <(printf '%s' "$CONFIGURATION" | xargs printf '%s\0')
        fi
        env "${cfg_args[@]}" localstack start -d

        if [ "$SKIP_WAIT" = false ]; then
          localstack wait -t "${LS_WAIT_TIMEOUT:-30}"  # Let users configure the timeout via env variable
        fi
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
        INSTALL_AWSLOCAL: ${{ inputs.install-awslocal }}
        USE_PRO: ${{ inputs.use-pro }}
        CONFIGURATION: ${{ inputs.configuration }}
        SKIP_WAIT: ${{ inputs.skip-wait }}
        CI_PROJECT: ${{ inputs.ci-project }}
