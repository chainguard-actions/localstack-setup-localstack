name: Test basic usage with github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PR event context
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/pull/1/merge
        run: |
          echo "Simulating pull_request event context"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: Assert action ran (pr-id.txt created or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo - PR comment/artifact API calls fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert pr-id.txt was created
        run: |
          if [ -f "./pr-id.txt" ]; then
            echo "PASS: pr-id.txt exists with content: $(cat ./pr-id.txt)"
          else
            echo "INFO: pr-id.txt not found (action may have failed before this step)"
          fi
