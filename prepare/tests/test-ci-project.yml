name: Test with ci-project input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ci-project: my-test-project

      - name: Assert pr-id.txt was created
        run: |
          if [ -f ./pr-id.txt ]; then
            echo "PASS: pr-id.txt exists"
            echo "contents: $(cat ./pr-id.txt)"
          else
            echo "FAIL: pr-id.txt was not created"
            exit 1
          fi

      - name: Assert action ran (comment step may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo without PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
