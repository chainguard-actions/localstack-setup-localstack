name: Test with ci-project input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ci-project: my-test-project

      - name: Assert action ran with ci-project input (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ci-project input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo - PR comment/artifact API calls fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert pr-id.txt was created by Save PR number step
        run: |
          if [ -f "./pr-id.txt" ]; then
            echo "PASS: pr-id.txt exists with content: $(cat ./pr-id.txt)"
          else
            echo "INFO: pr-id.txt not found (action may have failed at artifact upload or comment step)"
          fi
