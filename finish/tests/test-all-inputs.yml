name: Test all inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action tries to download a pr-id artifact and then post a PR comment.
      # Under the harness there are no uploaded artifacts and the sentinel repo
      # does not exist on GitHub, so the action will fail. We allow that and
      # assert it fails gracefully (not with an unexpected error code).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ci-project: my-ci-project
          include-preview: "true"
          preview-url: "https://example.localstack.cloud/preview/123"

      - name: Assert action ran (failed gracefully on sentinel repo / missing artifacts)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness — no artifacts and sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
