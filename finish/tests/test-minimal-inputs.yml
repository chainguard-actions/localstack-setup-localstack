name: Test minimal inputs - only required github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with only the required input (github-token).
      # No ci-project, no include-preview, no preview-url.
      # The action will attempt to download the 'pr-id' artifact (which doesn't exist)
      # and then try to post a PR comment (which fails on the sentinel repo).
      # We assert it either succeeds or fails gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: Assert action ran (failed gracefully on sentinel repo / missing artifact)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no artifact / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
