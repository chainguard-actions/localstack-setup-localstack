name: Test include-preview option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action tries to download artifacts and post a PR comment.
      # With include-preview=true it also tries to download a preview-instance-url artifact.
      # Under the harness, no artifacts exist and GITHUB_REPOSITORY is a sentinel,
      # so the action is expected to fail gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ci-project: test-project
          include-preview: "true"
          preview-url: "https://preview.example.com"

      - name: Assert action ran (failed gracefully on sentinel repo / missing artifact)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no artifact / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
