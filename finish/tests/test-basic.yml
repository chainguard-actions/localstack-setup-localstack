name: Test basic usage with ci-project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake pr-id.txt artifact so the action can load a PR ID
      - name: Create fake pr-id artifact
        run: |
          mkdir -p /tmp/pr-artifact
          echo "1" > /tmp/pr-artifact/pr-id.txt
          cp /tmp/pr-artifact/pr-id.txt "$GITHUB_WORKSPACE/pr-id.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ci-project: test-ci-project

      - name: Assert action ran (may fail due to sentinel repo or missing artifact)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
