name: Test basic usage (ci-project and github-token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake pr-id.txt artifact so the "Load the PR ID" step can read it
      # The action tries to download it via actions/download-artifact first (continue-on-error),
      # then falls back to dawidd6/action-download-artifact. Both will fail under the harness,
      # but we pre-create the file so the "Load the PR ID" step can still run.
      - name: Pre-create pr-id.txt for the Load step
        run: |
          echo "42" > "$GITHUB_WORKSPACE/pr-id.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ci-project: my-ci-project

      - name: Assert action ran (failed gracefully on sentinel repo or succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
