name: Test ephemeral preview inputs (preview-cmd and include-preview)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This scenario exercises preview-cmd and include-preview inputs.
      # The ephemeral instance creation requires LocalStack Cloud auth which
      # is not available in the harness, so we allow failure and assert on outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          image-tag: latest
          install-awslocal: 'false'
          skip-startup: 'true'
          state-action: start
          state-backend: ephemeral
          preview-cmd: 'echo "preview at $AWS_ENDPOINT_URL"'
          include-preview: 'true'
          lifetime: '30'

      - name: Assert action ran (preview-cmd and include-preview inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with preview-cmd and include-preview inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (ephemeral instance requires LocalStack Cloud auth)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
