name: Test ephemeral instance with preview inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ephemeral state and preview inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          skip-startup: 'true'
          state-action: 'start'
          state-backend: 'ephemeral'
          preview-cmd: 'echo "preview at $AWS_ENDPOINT_URL"'
          include-preview: 'true'
          lifetime: '30'

      - name: Assert action ran (ephemeral instance may fail without credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no ephemeral credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
