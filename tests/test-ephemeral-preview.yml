name: Test ephemeral instance with preview inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          image-tag: latest
          install-awslocal: 'false'
          skip-startup: 'true'
          state-backend: ephemeral
          state-action: start
          preview-cmd: 'echo "preview at $AWS_ENDPOINT_URL"'
          include-preview: 'false'
          lifetime: '30'

      - name: Assert action ran (ephemeral instance requires LocalStack Cloud API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without LocalStack Cloud API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
