name: Test skip-startup installs localstack CLI only
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with skip-startup true
        id: action
        uses: .
        with:
          skip-startup: 'true'
          install-awslocal: 'true'
        continue-on-error: true

      - name: Assert localstack CLI is installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action installs localstack CLI via pip when skip-startup=true
          # Check if localstack is available
          if command -v localstack > /dev/null 2>&1; then
            echo "PASS: localstack CLI is installed"
          else
            # Try to find it in pip-installed locations
            if python3 -m localstack --version > /dev/null 2>&1; then
              echo "PASS: localstack CLI is installed (via python3 -m)"
            else
              echo "INFO: outcome was $OUTCOME"
              if [ "$OUTCOME" = "failure" ]; then
                echo "PASS: action ran (may have failed due to sentinel repo or network)"
              else
                echo "FAIL: localstack CLI not found after action ran successfully"
                exit 1
              fi
            fi
          fi
