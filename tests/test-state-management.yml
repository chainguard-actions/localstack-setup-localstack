name: Test state management inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with state-name and cloud-pods backend
        id: action
        uses: .
        with:
          image-tag: 'latest'
          install-awslocal: 'false'
          skip-startup: 'true'
          state-backend: 'cloud-pods'
          state-action: 'save'
          state-name: 'my-cloud-pod-state'
          preview-cmd: 'echo deploy done'
          include-preview: 'true'
          github-token: ''
      - name: Assert step completed
        run: |
          echo "PASS: action completed with state-name and cloud-pods inputs"
