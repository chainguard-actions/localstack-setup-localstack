name: Test default LocalStack startup
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run setup-localstack with default startup
        uses: .
        with:
          image-tag: latest
          install-awslocal: 'true'
          use-pro: 'false'
          skip-startup: 'false'
          skip-wait: 'true'
        continue-on-error: true

      - name: Assert action ran (default startup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            # Verify localstack CLI is installed
            if which localstack > /dev/null 2>&1; then
              echo "PASS: localstack CLI is installed"
              localstack --version
            else
              echo "INFO: localstack CLI not found in PATH"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker or dynamic-uses path resolution may not be available under act harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
