name: Test default startup (LocalStack start)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run setup-localstack with default startup
        uses: .
        continue-on-error: true
        with:
          image-tag: 'latest'
          install-awslocal: 'true'
          skip-startup: 'false'
          skip-wait: 'true'

      - name: Assert action ran (LocalStack started or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying localstack CLI is installed..."
            if ! which localstack > /dev/null 2>&1; then
              echo "FAIL: localstack CLI not found in PATH after successful action"
              exit 1
            fi
            echo "PASS: localstack CLI is installed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (GH_ACTION_ROOT discovery not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
