name: Test skip-startup without awslocal install
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run setup-localstack with skip-startup and no awslocal
        uses: .
        with:
          image-tag: latest
          install-awslocal: 'false'
          skip-startup: 'true'
        continue-on-error: true

      - name: Assert action ran (skip-startup without awslocal)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            # Verify localstack CLI is installed
            if which localstack > /dev/null 2>&1; then
              echo "PASS: localstack CLI is installed"
              localstack --version
            else
              echo "INFO: localstack CLI not found in PATH (may be in pip bin)"
            fi
            # Verify awslocal is NOT installed (install-awslocal=false)
            if which awslocal > /dev/null 2>&1; then
              echo "INFO: awslocal CLI found (may have been pre-installed)"
            else
              echo "PASS: awslocal CLI not installed as expected"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dynamic-uses path resolution may not work under act harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
