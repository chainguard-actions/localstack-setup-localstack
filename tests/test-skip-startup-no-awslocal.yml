name: Test skip-startup without awslocal install
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run setup-localstack with skip-startup and no awslocal
        id: action
        uses: .
        continue-on-error: true
        with:
          skip-startup: 'true'
          install-awslocal: 'false'
          image-tag: 'latest'

      - name: Assert localstack installed but awslocal not installed (or action failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking CLIs..."
            if ! which localstack > /dev/null 2>&1; then
              echo "FAIL: localstack CLI not found in PATH after successful action"
              exit 1
            fi
            echo "PASS: localstack CLI found at $(which localstack)"
            if which awslocal > /dev/null 2>&1; then
              echo "FAIL: awslocal CLI was found but should not have been installed"
              exit 1
            fi
            echo "PASS: awslocal CLI correctly not installed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (dynamic sub-action path not resolvable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
