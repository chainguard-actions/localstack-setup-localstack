name: Test state-action save (local backend)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run setup-localstack with state-action save
        uses: .
        continue-on-error: true
        with:
          skip-startup: 'true'
          install-awslocal: 'false'
          state-action: 'save'
          state-backend: 'local'
          state-name: 'test-state'

      - name: Assert action ran (state save attempted or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with state-action=save"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (GH_ACTION_ROOT discovery not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
