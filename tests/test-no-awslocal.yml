name: Test skip-startup without awslocal install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with skip-startup and no awslocal
        id: action
        uses: .
        with:
          image-tag: latest
          install-awslocal: 'false'
          skip-startup: 'true'

      - name: Assert awslocal is NOT installed
        run: |
          echo "Checking that awslocal CLI is not installed..."
          if command -v awslocal &>/dev/null; then
            echo "FAIL: awslocal CLI was found but should not have been installed"
            exit 1
          fi
          echo "PASS: awslocal is not installed (as expected)"
