name: Test install-awslocal false skips awslocal installation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure awslocal is not pre-installed
        run: |
          # Remove awslocal if it happens to be installed
          pip uninstall -y awscli-local 2>/dev/null || true
          echo "Pre-check: awslocal present=$(command -v awslocal > /dev/null 2>&1 && echo yes || echo no)"

      - name: Run action with install-awslocal false and skip-startup true
        id: action
        uses: .
        with:
          skip-startup: 'true'
          install-awslocal: 'false'
        continue-on-error: true

      - name: Assert awslocal CLI is NOT installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to sentinel repo or network constraints)"
            exit 0
          fi
          # awslocal should NOT be installed when install-awslocal=false
          if command -v awslocal > /dev/null 2>&1; then
            echo "FAIL: awslocal CLI was installed even though install-awslocal=false"
            exit 1
          else
            echo "PASS: awslocal CLI is correctly not installed"
          fi
