name: Test state-name input with state management
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with state-name input (state-action=save, state-backend=cloud-pods)
        id: action
        uses: .
        continue-on-error: true
        with:
          image-tag: latest
          install-awslocal: 'false'
          skip-startup: 'false'
          state-action: 'save'
          state-backend: 'cloud-pods'
          state-name: 'test-state-artifact'

      - name: Assert action ran with state-name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with state-name input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without LocalStack Cloud credentials or running instance)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
