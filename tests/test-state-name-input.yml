name: Test state-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with state-name input
        id: action
        uses: .
        continue-on-error: true
        with:
          image-tag: latest
          install-awslocal: 'false'
          skip-startup: 'false'
          state-action: save
          state-backend: cloud-pods
          state-name: test-state-artifact

      - name: Assert action ran (state-name input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail without real LocalStack Cloud credentials,
          # but it must not fail due to unrecognized inputs.
          # Both 'success' and 'failure' are acceptable; 'skipped' is not.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with state-name input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
