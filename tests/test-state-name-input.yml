name: Test state-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-startup: 'true'
          state-action: 'save'
          state-backend: 'cloud-pods'
          state-name: 'test-state-artifact'

      - name: Assert action ran (state save fails gracefully without auth token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (state saved)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no auth token available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
