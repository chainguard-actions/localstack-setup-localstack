name: Test state-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This scenario exercises the state-name input.
      # State management (save/load) requires LocalStack Cloud auth which
      # is not available in the harness, so we allow failure and assert on outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          image-tag: latest
          install-awslocal: 'false'
          skip-startup: 'true'
          state-action: save
          state-backend: cloud-pods
          state-name: my-test-state

      - name: Assert action ran (state-name input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with state-name input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (state management requires LocalStack Cloud auth)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
