name: Test state management with state-name input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with state-action save and state-name
        id: action
        uses: .
        with:
          skip-startup: 'true'
          state-action: 'save'
          state-backend: 'cloud-pods'
          state-name: 'my-test-state'
        continue-on-error: true

      - name: Assert action ran with state-name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with state-name input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cloud-pods state backend not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
