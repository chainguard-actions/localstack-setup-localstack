name: Test state-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action with state-name input (save state)
        id: action
        uses: .
        continue-on-error: true
        with:
          skip-startup: 'true'
          state-action: 'save'
          state-backend: 'cloud-pods'
          state-name: 'my-test-state'

      - name: Assert action ran (state save requires LocalStack running)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (state save requires LocalStack running or CI auth token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
