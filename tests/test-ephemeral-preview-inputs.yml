name: Test ephemeral preview inputs (preview-cmd and include-preview)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-startup: 'true'
          state-action: 'start'
          state-backend: 'ephemeral'
          preview-cmd: 'echo preview'
          include-preview: 'true'
          lifetime: '30'

      - name: Assert action ran (ephemeral instance fails gracefully without auth token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (ephemeral instance created)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no auth token available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
