name: Test ephemeral preview inputs (preview-cmd and include-preview)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with preview-cmd and include-preview inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          skip-startup: 'true'
          state-action: 'start'
          state-backend: 'ephemeral'
          preview-cmd: 'echo "preview ready at $AWS_ENDPOINT_URL"'
          include-preview: 'true'
          github-token: ${{ github.token }}
          lifetime: '10'

      - name: Assert action ran (ephemeral instance requires LocalStack Cloud credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (ephemeral instance requires LocalStack Cloud credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
