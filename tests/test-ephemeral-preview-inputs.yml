name: Test ephemeral preview inputs (preview-cmd and include-preview)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with preview-cmd and include-preview inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          image-tag: latest
          install-awslocal: 'false'
          skip-startup: 'false'
          state-action: start
          state-backend: ephemeral
          preview-cmd: 'echo "preview at $AWS_ENDPOINT_URL"'
          include-preview: 'true'
          lifetime: '30'

      - name: Assert action ran (preview-cmd and include-preview inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail without real LocalStack Cloud credentials,
          # but it must not fail due to unrecognized inputs.
          # Both 'success' and 'failure' are acceptable; 'skipped' is not.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with preview-cmd and include-preview inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
