name: Test save action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock localstack CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/localstack" << 'EOF'
          #!/bin/sh
          echo "mock localstack called with: $*"
          if [ "$1" = "state" ] && [ "$2" = "export" ]; then
            # Create a fake zip file at the path provided
            touch "$3"
            echo "State exported to $3"
            exit 0
          fi
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/localstack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: ls-state
          action: save

      - name: Assert save action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: save action succeeded with mock localstack"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: save action failed gracefully (localstack not available or artifact upload failed on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
